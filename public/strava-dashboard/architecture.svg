<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0f0f0f" fill-opacity="0.22"/>
    </marker>
    <marker id="arr-p" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7C3AED" fill-opacity="0.45"/>
    </marker>
    <marker id="arr-dim" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0f0f0f" fill-opacity="0.14"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#F9F9F7"/>

  <!-- ── MCP SERVER (above dashboard) ── -->
  <rect x="470" y="34" width="260" height="68" rx="10" fill="white" stroke="#0f0f0f" stroke-width="1" stroke-opacity="0.18" stroke-dasharray="6 4"/>
  <text x="600" y="62" font-size="13" font-weight="600" fill="#0f0f0f" fill-opacity="0.55" text-anchor="middle">Strava MCP Server</text>
  <text x="600" y="83" font-size="11" fill="#0f0f0f" fill-opacity="0.32" text-anchor="middle">5 tools · Claude queries Strava conversationally</text>
  <!-- MCP → Dashboard -->
  <line x1="600" y1="103" x2="600" y2="150" stroke="#0f0f0f" stroke-opacity="0.16" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr-dim)"/>

  <!-- ── DATA SOURCES (left) ── -->

  <!-- Strava -->
  <rect x="30" y="152" width="196" height="88" rx="10" fill="white" stroke="#FC4C02" stroke-width="1.5"/>
  <rect x="30" y="152" width="5" height="88" rx="2.5" fill="#FC4C02"/>
  <text x="130" y="187" font-size="14" font-weight="700" fill="#0f0f0f" text-anchor="middle">Strava API</text>
  <text x="130" y="208" font-size="11" fill="#0f0f0f" fill-opacity="0.45" text-anchor="middle">Activities · Laps · HR</text>
  <text x="130" y="225" font-size="11" fill="#0f0f0f" fill-opacity="0.45" text-anchor="middle">activity:read_all scope</text>

  <!-- Google Sheets -->
  <rect x="30" y="265" width="196" height="88" rx="10" fill="white" stroke="#34A853" stroke-width="1.5"/>
  <rect x="30" y="265" width="5" height="88" rx="2.5" fill="#34A853"/>
  <text x="130" y="300" font-size="14" font-weight="700" fill="#0f0f0f" text-anchor="middle">Google Sheets</text>
  <text x="130" y="321" font-size="11" fill="#0f0f0f" fill-opacity="0.45" text-anchor="middle">Season training plan</text>
  <text x="130" y="338" font-size="11" fill="#0f0f0f" fill-opacity="0.45" text-anchor="middle">Service account auth</text>

  <!-- Gmail -->
  <rect x="30" y="378" width="196" height="88" rx="10" fill="white" stroke="#EA4335" stroke-width="1.5"/>
  <rect x="30" y="378" width="5" height="88" rx="2.5" fill="#EA4335"/>
  <text x="130" y="413" font-size="14" font-weight="700" fill="#0f0f0f" text-anchor="middle">Gmail</text>
  <text x="130" y="434" font-size="11" fill="#0f0f0f" fill-opacity="0.45" text-anchor="middle">Weekly coach emails</text>
  <text x="130" y="451" font-size="11" fill="#0f0f0f" fill-opacity="0.45" text-anchor="middle">OAuth2 user flow</text>

  <!-- ── ARROWS: sources → dashboard ── -->
  <path d="M226,196 C345,196 385,238 468,238" stroke="#0f0f0f" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)"/>
  <path d="M226,309 C345,309 385,308 468,308" stroke="#0f0f0f" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)"/>
  <path d="M226,422 C345,422 385,378 468,378" stroke="#0f0f0f" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)"/>

  <!-- ── DASHBOARD (center) ── -->
  <rect x="470" y="154" width="260" height="318" rx="16" fill="white" stroke="#0f0f0f" stroke-width="2"/>
  <text x="600" y="224" font-family="Georgia,'Times New Roman',serif" font-size="18" font-weight="700" fill="#0f0f0f" text-anchor="middle">Training Dashboard</text>
  <line x1="492" y1="238" x2="708" y2="238" stroke="#0f0f0f" stroke-opacity="0.07" stroke-width="1"/>
  <text x="600" y="266" font-size="12" fill="#0f0f0f" fill-opacity="0.38" text-anchor="middle">Next.js 14 App Router</text>
  <text x="600" y="287" font-size="12" fill="#0f0f0f" fill-opacity="0.38" text-anchor="middle">TypeScript · Server Components</text>
  <text x="600" y="318" font-size="12" fill="#0f0f0f" fill-opacity="0.26" text-anchor="middle">Strava OAuth token refresh</text>
  <text x="600" y="338" font-size="12" fill="#0f0f0f" fill-opacity="0.26" text-anchor="middle">Week navigation ← →</text>
  <text x="600" y="358" font-size="12" fill="#0f0f0f" fill-opacity="0.26" text-anchor="middle">Notes sync: localStorage + server</text>
  <text x="600" y="445" font-family="Georgia,serif" font-size="11" fill="#0f0f0f" fill-opacity="0.16" text-anchor="middle">training.mitchleonard.com</text>

  <!-- ── ARROWS: dashboard → features ── -->
  <path d="M730,238 C820,238 860,196 897,196" stroke="#0f0f0f" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)"/>
  <path d="M730,308 C820,308 860,309 897,309" stroke="#0f0f0f" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)"/>
  <path d="M730,378 C820,378 860,422 897,422" stroke="#0f0f0f" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)"/>

  <!-- ── OUTPUT FEATURES (right) ── -->

  <!-- Plan vs Actual -->
  <rect x="899" y="152" width="196" height="88" rx="10" fill="white" stroke="#85d4ff" stroke-width="1.5"/>
  <rect x="899" y="152" width="5" height="88" rx="2.5" fill="#85d4ff"/>
  <text x="999" y="187" font-size="14" font-weight="700" fill="#0f0f0f" text-anchor="middle">Plan vs Actual</text>
  <text x="999" y="208" font-size="11" fill="#0f0f0f" fill-opacity="0.45" text-anchor="middle">% of peak target</text>
  <text x="999" y="225" font-size="11" fill="#0f0f0f" fill-opacity="0.45" text-anchor="middle">Editable notes per day</text>

  <!-- Workout Feed -->
  <rect x="899" y="265" width="196" height="88" rx="10" fill="white" stroke="#fde74c" stroke-width="1.5"/>
  <rect x="899" y="265" width="5" height="88" rx="2.5" fill="#fde74c"/>
  <text x="999" y="300" font-size="14" font-weight="700" fill="#0f0f0f" text-anchor="middle">Workout Feed</text>
  <text x="999" y="321" font-size="11" fill="#0f0f0f" fill-opacity="0.45" text-anchor="middle">AI analysis · Lap data</text>
  <text x="999" y="338" font-size="11" fill="#0f0f0f" fill-opacity="0.45" text-anchor="middle">Since Jan 2026</text>

  <!-- Week History -->
  <rect x="899" y="378" width="196" height="88" rx="10" fill="white" stroke="#f56e3d" stroke-width="1.5"/>
  <rect x="899" y="378" width="5" height="88" rx="2.5" fill="#f56e3d"/>
  <text x="999" y="413" font-size="14" font-weight="700" fill="#0f0f0f" text-anchor="middle">Week History</text>
  <text x="999" y="434" font-size="11" fill="#0f0f0f" fill-opacity="0.45" text-anchor="middle">6-week auto-backfill</text>
  <text x="999" y="451" font-size="11" fill="#0f0f0f" fill-opacity="0.45" text-anchor="middle">Season history view</text>

  <!-- ── ANTHROPIC (below dashboard) ── -->
  <rect x="470" y="498" width="260" height="80" rx="12" fill="white" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="470" y="498" width="260" height="5" rx="2.5" fill="#7C3AED"/>
  <text x="600" y="537" font-size="14" font-weight="700" fill="#0f0f0f" text-anchor="middle">Anthropic Claude</text>
  <text x="600" y="558" font-size="11" fill="#0f0f0f" fill-opacity="0.45" text-anchor="middle">Streaming · 2 sections per workout</text>

  <!-- Dashboard → Anthropic -->
  <path d="M600,473 L600,496" stroke="#7C3AED" stroke-opacity="0.38" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arr-p)"/>

</svg>
