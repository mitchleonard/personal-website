<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .serif{font-family:"DM Serif Display",Georgia,'Times New Roman',serif}
      .sans{font-family:Roboto,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    </style>
  </defs>
  <rect width="1200" height="640" fill="#f7f5f2"/>
  <!-- label -->
  <text x="72" y="92" class="sans" font-size="20" letter-spacing="3" fill="#0f0f0f" opacity="0.5">THE PROMPT · HACKATHON #004</text>
  <text x="70" y="150" class="serif" font-size="46" fill="#0f0f0f">Where it started</text>
  <rect x="72" y="168" width="150" height="4" rx="2" fill="#f56e3d"/>

  <!-- prompt bubble -->
  <rect x="72" y="210" width="1056" height="330" rx="22" fill="#ffffff" stroke="#e7e2dc" stroke-width="1.5"/>
  <text x="104" y="262" class="sans" font-size="15" letter-spacing="1.5" fill="#006fab">ME  →  CLAUDE (FABLE 5)</text>

  <g class="sans" font-size="25" fill="#0f0f0f">
    <text x="104" y="312">As a hackathon project, build me an “ice cream mode” for my</text>
    <text x="104" y="352">personal website. When triggered, the whimsy of the site should</text>
    <text x="104" y="392">turn into ice cream pieces — <tspan fill="#0f0f0f" font-weight="700">sprinkles falling from the top</tspan>,</text>
    <text x="104" y="432"><tspan font-weight="700">bright colors</tspan> instead of what’s used now, and <tspan font-weight="700">waffle-cone and</tspan></text>
    <text x="104" y="472"><tspan font-weight="700">ice cream textures</tspan>. Trigger it from an ice cream icon in the</text>
    <text x="104" y="512">menu as well as the “Powered by 🍦” button.</text>
  </g>

  <text x="1092" y="600" class="sans" font-size="17" text-anchor="end" fill="#0f0f0f" opacity="0.45">One prompt. First version live in ~15 minutes.</text>
</svg>
